name: Build APK + Web

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate Flutter project (first time only)
        run: |
          if [ ! -f pubspec.yaml ]; then
            flutter create . --project-name notes_app --org com.example --platforms android,web
          fi

      - name: Add packages
        run: flutter pub add shared_preferences

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: setup flutter + deps" || echo "nothing to commit"
          git push

      # ─────────────── APK BUILD ───────────────
      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: notes-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # ─────────────── WEB BUILD ───────────────
      - name: Build Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
