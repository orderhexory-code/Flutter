name: mobile_ide
description: Mobile Native IDE Engine
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  file_picker: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

# ============================================================
# APP ICON CONFIG
# ============================================================
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

  # Android 8+ adaptive icon (foreground + background)
  adaptive_icon_background: "#181818"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

  # Web favicon
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#181818"
    theme_color: "#007ACC"

  # Windows .ico
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48

  # macOS .icns
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

# ============================================================
# SPLASH SCREEN CONFIG
# ============================================================
flutter_native_splash:
  color: "#181818"
  image: assets/icon/splash_logo.png
  color_dark: "#181818"
  image_dark: assets/icon/splash_logo.png

  android_12:
    color: "#181818"
    image: assets/icon/app_icon_foreground.png
    icon_background_color: "#181818"
    color_dark: "#181818"
    image_dark: assets/icon/app_icon_foreground.png
    icon_background_color_dark: "#181818"

  fullscreen: true
  android: true
  ios: true
  web: false
